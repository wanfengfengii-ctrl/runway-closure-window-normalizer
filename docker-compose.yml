services:
  api:
    build: .
    image: runway-closure-planner
    ports:
      # Host port is overridable: API_PORT=9000 docker compose up api
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  # One-shot acceptance service: runs the checks in app/verify.py against the
  # live API and exits non-zero if any of them fail.  It reuses the image
  # built for `api` — declaring `build:` here too would make both services
  # race to tag the same image name during a parallel build.
  #
  # It lives behind the `verify` profile so a plain `docker compose up` only
  # manages the long-running API.  A one-shot container in the default set
  # would make `up` tear down the API (and its healthchecks) as soon as the
  # checks finish, and some compose versions then judge the whole startup as
  # failed.  Run it explicitly:
  #   docker compose --profile verify up --build --exit-code-from verify
  #   docker compose run --rm verify
  verify:
    profiles: ["verify"]
    image: runway-closure-planner
    pull_policy: never
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
    command: ["python", "-m", "app.verify"]
    restart: "no"
